name: Build Windows release

on:
  release:
    types: [published]
  workflow_dispatch:

# Building and testing require no repository write access. Only the final
# release attachment job can write, and manual builds never run that job.
permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.release.id || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Windows x64 package
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the event source commit
        env:
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($commit -ne $env:EVENT_COMMIT) {
            throw 'The checked-out source differs from the event commit; the tag may have moved.'
          }

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64

      - name: Fetch verified dependencies, build, test and package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @('-B', '-m', 'enshrouded_data.map_tool.automation',
            '--output', 'dist', '--dependencies', '.dependencies')
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $arguments += @('--tag', $env:RELEASE_TAG)
          }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record the verified build identity
        id: metadata
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = Get-Content -LiteralPath dist/release-assets.json -Raw | ConvertFrom-Json
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($metadata.schema_version -ne 1 -or $metadata.source_commit -ne $commit) {
            throw 'The release manifest does not identify this source commit.'
          }
          if ($metadata.tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Expected a release tag in the form vX.Y.Z.'
          }
          "source_commit=$commit" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$($metadata.tag)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Retain the tested ZIP, checksum and release manifest
        id: artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/release-assets.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attach:
    name: Attach the tested build to the published release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the attachment verifier at the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64

      - name: Download this run's tested assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-assets
          merge-multiple: true
          digest-mismatch: error

      - name: Verify the release target and attach assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          python -B .github/scripts/attach_release.py \
            --directory release-assets \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --commit "$EXPECTED_COMMIT"
